<style>
    div{
        background-color: black;
        width: 100px;
        height: 100px;
    }
    .withmax{
        width: 900px;
        transition: 5s;
    }
</style>

<div id="box">

</div>
<button onclick="Change()">Change color</button>
<script>
    var box=document.getElementById("box")

    function Change(){
        box.style.backgroundColor="red "
        box.setAttribute("class","withmax")
    }
</script>
